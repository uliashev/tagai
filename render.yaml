services:
  - type: web
    name: tagai-web
    env: docker
    plan: starter
    buildCommand: docker build -t tagai-web .
    startCommand: uvicorn config.asgi:application --host 0.0.0.0 --port 8000
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: tagai-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: tagai-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: tagai-redis
          property: connectionString
      - key: WEB_CONCURRENCY
        value: "2"
      - key: DJANGO_ENV
        value: "docker"

  - type: worker
    name: tagai-worker
    env: docker
    dockerCommand: celery -A config worker -l info
    envVars:
      - key: SECRET_KEY
        fromService:
          type: web
          name: tagai-web
          envVarKey: SECRET_KEY
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: tagai-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: tagai-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: tagai-redis
          property: connectionString
      - key: DJANGO_ENV
        value: "docker"

  - type: redis
    name: tagai-redis
    plan: starter
    ipAllowList: [] # internal use only

databases:
  - name: tagai-db
    databaseName: tagai
    user: tagai_user
    plan: starter
